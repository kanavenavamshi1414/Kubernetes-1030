apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: kubernetes-1030
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/kanavenavamshi1414/Kubernetes-1030.git
    targetRevision: main
    path: k8s-files

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
